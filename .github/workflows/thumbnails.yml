name: Generate thumbnails and README

on:
  workflow_dispatch:

  push:
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate thumbnails
        run: |
          rm -rf thumbs
          mkdir -p thumbs

          for img in *.jpg *.jpeg *.png; do
            [ -e "$img" ] || continue

            convert "$img" \
              -auto-orient \
              -thumbnail 300x300^ \
              -gravity center \
              -extent 300x300 \
              "thumbs/$img"
          done

      - name: Generate README
        run: |
          {
           echo "# 📸 Fotogalerie"
           echo ""
           echo "<p align=\"center\">"
           echo ""

           for img in *.jpg *.jpeg *.png; do
             [ -e "$img" ] || continue

             echo "<a href=\"$img\">"
             echo "  <img src=\"thumbs/$img\">"
             echo "</a>"
             echo ""
           done
         
           echo "</p>"
          } > README.md

      - name: Commit thumbnails and README
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add thumbs README.md

          git diff --cached --quiet || git commit -m "Update gallery"
          git push
