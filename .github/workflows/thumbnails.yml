name: Generate thumbnails and README

on:
  workflow_dispatch:

  push:
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate thumbnails
        run: |
          mkdir -p thumbs

          for img in *.jpg *.jpeg *.png; do
            [ -e "$img" ] || continue

            convert "$img" \
              -auto-orient \
              -thumbnail 300x300 \
              "thumbs/$img"
          done

      - name: Generate README
        run: |
          cat > README.md <<'EOF'
          # 📸 Fotogalerie

          | Náhled | Stažení originálu |
          |---|---|
          EOF

          for img in *.jpg *.jpeg *.png; do
            [ -e "$img" ] || continue
            echo "| [![](thumbs/$img)]($img) | [⬇️ Stáhnout]($img) |" >> README.md
          done

      - name: Commit thumbnails and README
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add thumbs README.md

          git diff --cached --quiet || git commit -m "Update gallery"
          git push
